name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check lib/index.js

      - name: Contract tests
        run: node --test test/contract.test.mjs

      - name: Package manifest
        run: node -e "const p = require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); console.log('bundle patch:', p.dsh.bundle.patch);"
