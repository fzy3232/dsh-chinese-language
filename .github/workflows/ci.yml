name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check lib/index.js

      # No install step: the plugin has no dependencies, the contract suite
      # runs on a stubbed context, and the real-harness suite reports as skipped
      # because @deepseek-ai/* is not available here.
      - name: Tests
        run: npm test
